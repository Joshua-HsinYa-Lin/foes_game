<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="允望樂園">
<meta name="theme-color" content="#1d2a18">
<meta name="format-detection" content="telephone=no">
<title>允望樂園 Yunwang Paradise</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="title" class="screen menu">
  <div class="card wide">
    <div class="logo">
      <div class="seal">允望<br>樓</div>
      <div>
        <h1>允望樂園</h1>
        <div class="logo-en">YUNWANG PARADISE</div>
      </div>
    </div>
    <p class="tagline" data-i18n="subtitle"></p>
    <div class="modes">
      <button id="btnStory" class="mode primary"><b data-i18n="story"></b><span data-i18n="storySub"></span></button>
      <button id="btnRoyale" class="mode"><b data-i18n="royale"></b><span data-i18n="royaleSub"></span></button>
      <button id="btnLan" class="mode"><b data-i18n="lan"></b><span data-i18n="lanSub"></span></button>
    </div>
    <div class="field view-row"><span data-i18n="viewLabel"></span><div class="seg view-seg" id="viewSeg"><button data-v="2d" data-i18n="view2d"></button><button data-v="25d" data-i18n="view25d"></button></div></div>
    <div class="toggles">
      <button id="tLang" class="chip">中文 / EN</button>
      <button id="tMusic" class="chip"></button>
      <button id="tSfx" class="chip"></button>
      <button id="tFull" class="chip" hidden data-i18n="fullscreen"></button>
    </div>
    <details id="secrets" class="controls secrets"><summary id="secretsSum"></summary><ul id="secretsList"></ul></details>
    <p id="lanNote" class="note"></p>
    <p id="menuNote" class="note warn"></p>
    <details class="controls">
      <summary data-i18n="controls"></summary>
      <table>
        <tr><td>W A S D</td><td data-i18n="ctl_move"></td></tr>
        <tr><td>Mouse</td><td data-i18n="ctl_mouse"></td></tr>
        <tr><td>H</td><td data-i18n="ctl_heal"></td></tr>
        <tr><td>Right click / X</td><td data-i18n="ctl_skill"></td></tr>
        <tr><td>G</td><td data-i18n="ctl_gadget"></td></tr>
        <tr><td>V</td><td data-i18n="ctl_od"></td></tr>
        <tr><td>Space</td><td data-i18n="ctl_run"></td></tr>
        <tr><td>Shift</td><td data-i18n="ctl_jump"></td></tr>
        <tr><td>F / E</td><td data-i18n="ctl_f"></td></tr>
        <tr><td>Q / Wheel</td><td data-i18n="ctl_q"></td></tr>
        <tr><td>1 2 3 4</td><td data-i18n="ctl_num"></td></tr>
        <tr><td>R</td><td data-i18n="ctl_r"></td></tr>
        <tr><td>C</td><td data-i18n="ctl_c"></td></tr>
        <tr><td>M</td><td data-i18n="ctl_m"></td></tr>
        <tr><td>Esc</td><td data-i18n="ctl_esc"></td></tr>
      </table>
      <table class="touch-help">
        <tr><td data-i18n="th_left"></td><td data-i18n="th_left_do"></td></tr>
        <tr><td data-i18n="th_right"></td><td data-i18n="th_right_do"></td></tr>
        <tr><td data-i18n="th_tap"></td><td data-i18n="th_tap_do"></td></tr>
        <tr><td data-i18n="th_slots"></td><td data-i18n="th_slots_do"></td></tr>
        <tr><td data-i18n="th_hud"></td><td data-i18n="th_hud_do"></td></tr>
        <tr><td data-i18n="th_gadget"></td><td data-i18n="th_gadget_do"></td></tr>
        <tr><td data-i18n="th_buttons"></td><td data-i18n="th_buttons_do"></td></tr>
      </table>
    </details>
  </div>
</div>

<div id="heroes" class="screen menu" hidden>
  <div class="card wide">
    <h2 data-i18n="chooseHero"></h2>
    <div id="heroCards" class="hero-cards"></div>
    <div id="heroInfo" class="hero-info"></div>
    <div class="form">
      <label class="field"><span data-i18n="name"></span><input id="name" maxlength="16" placeholder="Player" autocomplete="off" spellcheck="false"></label>
      <div class="field"><span data-i18n="diff"></span><div class="seg diff-seg" id="diff"></div></div>
      <p id="diffHint" class="note diff-hint"></p>
      <div class="field" id="botsRow"><span data-i18n="bots"></span><div class="range"><input type="range" id="bots" min="1" max="29" value="13"><b id="botsv">13</b></div></div>
      <div class="field"><span></span><button id="tTrial" class="chip trial"></button></div>
      <label class="field" id="serverRow" hidden><span data-i18n="serverAddr"></span><input id="server" maxlength="80" autocomplete="off" spellcheck="false"></label>
    </div>
    <div class="btns">
      <button id="heroBack" class="btn" data-i18n="back"></button>
      <button id="heroGo" class="btn primary" data-i18n="start"></button>
    </div>
  </div>
</div>

<div id="chapters" class="screen menu" hidden>
  <div class="card wide">
    <h2 data-i18n="chooseChapter"></h2>
    <div id="chapterList" class="chapter-list"></div>
    <div class="btns">
      <button id="chapBack" class="btn" data-i18n="back"></button>
    </div>
  </div>
</div>

<div id="dialogue" class="screen dim" hidden>
  <div class="scroll">
    <div class="scroll-inner">
      <canvas id="portrait" width="240" height="240"></canvas>
      <div class="speech">
        <div id="speaker" class="speaker"></div>
        <div id="line" class="line"></div>
        <div class="dlg-foot">
          <span class="hint" data-i18n="tapContinue"></span>
          <button id="dlgSkip" class="chip" data-i18n="skip"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="overlay" class="screen dim" hidden>
  <div class="card result">
    <h2 id="ovTitle"></h2>
    <p id="ovSub"></p>
    <div id="ovStats" class="stats"></div>
    <p id="ovXp" class="note xp-note"></p>
    <div class="btns">
      <button id="ovSpectate" class="btn" data-i18n="spectate"></button>
      <button id="ovAgain" class="btn primary"></button>
      <button id="ovMenu" class="btn" data-i18n="menu"></button>
    </div>
  </div>
</div>

<div id="pause" class="screen dim" hidden>
  <div class="card small">
    <h2 id="pauseTitle"></h2>
    <button id="pauseResume" class="btn primary" data-i18n="resume"></button>
    <div class="field pause-diff" id="pauseDiffRow"><span data-i18n="diff"></span><div class="seg diff-seg" id="pauseDiff"></div></div>
    <button id="pauseMusic" class="btn"></button>
    <button id="pauseSfx" class="btn"></button>
    <div class="field pause-diff"><span data-i18n="viewLabel"></span><div class="seg view-seg" id="pauseView"><button data-v="2d" data-i18n="view2d"></button><button data-v="25d" data-i18n="view25d"></button></div></div>
    <button id="pauseQuit" class="btn"></button>
  </div>
</div>

<div id="lobby" class="screen dim" hidden>
  <div class="card wide">
    <h2 data-i18n="waitingRoom"></h2>
    <p id="lobbyText" class="room-status"></p>
    <p id="lobbyShare" class="note"></p>
    <div id="roomPlayers" class="room-players"></div>
    <div class="field room-chars-row"><span data-i18n="changeHero"></span><div id="roomChars" class="room-chars"></div></div>
    <div id="roomHost" class="form">
      <div class="field"><span data-i18n="bots"></span><div class="range"><input type="range" id="roomBots" min="0" max="29" value="13"><b id="roomBotsV">13</b></div></div>
      <div class="field"><span data-i18n="diff"></span><div class="seg diff-seg" id="roomDiff"></div></div>
      <div class="field"><span data-i18n="matchMode"></span><div class="seg" id="roomMode"><button data-v="ffa" data-i18n="mode_ffa"></button><button data-v="teams" data-i18n="mode_teams"></button><button data-v="coop" data-i18n="mode_coop"></button></div></div>
    </div>
    <p id="roomModeHint" class="note"></p>
    <div class="field" id="roomTeamRow" hidden><span data-i18n="yourTeam"></span><div class="seg team-seg" id="roomTeam"><button data-v="0" data-i18n="team_0"></button><button data-v="1" data-i18n="team_1"></button><button data-v="2" data-i18n="team_2"></button></div></div>
    <p id="roomSummary" class="note"></p>
    <div class="btns">
      <button id="lobbyLeave" class="btn" data-i18n="leave"></button>
      <button id="roomStart" class="btn primary" data-i18n="startMatch"></button>
    </div>
  </div>
</div>

<div id="specbar" class="specbar" hidden>
  <span data-i18n="specHint"></span>
  <button id="specNext" class="btn" data-i18n="nextPlayer"></button>
  <button id="specAgain" class="btn primary"></button>
  <button id="specMenu" class="btn" data-i18n="menu"></button>
</div>

<div id="lobbyBanner" class="banner" hidden></div>

<div id="quiz" class="screen dim" hidden>
  <div class="card quiz-card">
    <div class="quiz-head"><h2 data-i18n="quizTitle"></h2><span id="quizClock" class="quiz-clock"></span></div>
    <p class="note quiz-hint" data-i18n="quizHint"></p>
    <p id="quizQ" class="quiz-q"></p>
    <div id="quizOpts" class="quiz-opts"></div>
    <div class="quiz-foot">
      <span id="quizMsg" class="quiz-msg"></span>
      <button id="quizGo" class="btn primary" data-i18n="quizSubmit"></button>
    </div>
  </div>
</div>

<div id="touchUI" hidden>
  <div id="stickL" class="stick"><div class="knob"></div></div>
  <div id="stickR" class="stick aim"><div class="knob"></div></div>
  <button id="tbPause" class="tb small" aria-label="menu">☰</button>
  <button id="tbUse" class="tb use" hidden></button>
  <button id="tbReload" class="tb" aria-label="reload">⟳</button>
  <button id="tbJump" class="tb" aria-label="jump">⤒</button>
</div>

<div id="rotate" class="screen dim" hidden>
  <div class="card small">
    <div class="rotate-icon">📱↻</div>
    <h2 data-i18n="rotateTitle"></h2>
    <p class="note" data-i18n="rotateText"></p>
    <button id="rotateAnyway" class="btn" data-i18n="rotateAnyway"></button>
  </div>
</div>

<div id="note" class="note-card" hidden>
  <h3 id="noteTitle"></h3>
  <div id="noteBody"></div>
  <button id="noteClose" class="chip" data-i18n="noteClose"></button>
</div>

<script src="js/data.js"></script>
<script src="js/quiz.js"></script>
<script src="js/i18n.js"></script>
<script src="js/sim.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/client.js"></script>
</body>
</html>
